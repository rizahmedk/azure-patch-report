<svg width="680" height="640" viewBox="0 0 680 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Architecture diagram: Azure Update Manager monthly patch report pipeline</title>
<desc>Logic App workflow with six steps (Recurrence, Create job, Get job output, Parse JSON, Get blob content, Send an email) on the left, connected to backing Azure services on the right: Automation Runbook with Resource Graph queries, Blob Storage, and Office 365 Outlook.</desc>

<style>
  text { font-family: -apple-system, "Segoe UI", Arial, sans-serif; }
  .title { font-size: 14px; font-weight: 600; }
  .sub { font-size: 11.5px; }
  .section { font-size: 12px; font-weight: 600; letter-spacing: 0.3px; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ============ Section headers ============ -->
<text x="30" y="34" class="section" fill="#5F5E5A">LOGIC APP WORKFLOW</text>
<text x="380" y="34" class="section" fill="#5F5E5A">BACKING SERVICES</text>

<!-- ============ LEFT COLUMN: Logic App steps ============ -->

<!-- 1. Recurrence -->
<g>
  <rect x="30" y="70" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.75"/>
  <circle cx="55" cy="98" r="11" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
  <path d="M55 91v7l5 4" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round"/>
  <text x="75" y="94" class="title" fill="#2C2C2A">Recurrence</text>
  <text x="75" y="111" class="sub" fill="#5F5E5A">Monthly &#8226; 1st day, 07:00 UTC</text>
</g>
<line x1="180" y1="126" x2="180" y2="160" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- 2. Create job -->
<g>
  <rect x="30" y="160" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.75"/>
  <path d="M55 187l6-13 3 7 6-13 3 19" fill="none" stroke="#085041" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="75" y="184" class="title" fill="#04342C">Create job</text>
  <text x="75" y="201" class="sub" fill="#0F6E56">Start the Automation runbook</text>
</g>
<line x1="180" y1="216" x2="180" y2="250" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- 3. Get job output -->
<g>
  <rect x="30" y="250" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.75"/>
  <path d="M55 277l6-13 3 7 6-13 3 19" fill="none" stroke="#085041" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="75" y="274" class="title" fill="#04342C">Get job output</text>
  <text x="75" y="291" class="sub" fill="#0F6E56">Retrieve JSON summary from runbook</text>
</g>
<line x1="180" y1="306" x2="180" y2="340" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- 4. Parse JSON -->
<g>
  <rect x="30" y="340" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.75"/>
  <text x="55" y="374" font-size="15" font-weight="700" fill="#3C3489">{ }</text>
  <text x="75" y="364" class="title" fill="#26215C">Parse JSON</text>
  <text x="75" y="381" class="sub" fill="#534AB7">BlobUrl, BlobPath, Total, Failed</text>
</g>
<line x1="180" y1="396" x2="180" y2="430" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- 5. Get blob content -->
<g>
  <rect x="30" y="430" width="300" height="56" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.75"/>
  <ellipse cx="55" cy="452" rx="9" ry="4" fill="none" stroke="#712B13" stroke-width="1.3"/>
  <path d="M46 452v10a9 4 0 0 0 18 0v-10" fill="none" stroke="#712B13" stroke-width="1.3"/>
  <text x="75" y="454" class="title" fill="#4A1B0C">Get blob content (V2)</text>
  <text x="75" y="471" class="sub" fill="#993C1D">Read the generated Excel file</text>
</g>
<line x1="180" y1="486" x2="180" y2="520" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- 6. Send an email -->
<g>
  <rect x="30" y="520" width="300" height="56" rx="8" fill="#FBEAF0" stroke="#ED93B1" stroke-width="0.75"/>
  <rect x="46" y="540" width="18" height="13" rx="1.5" fill="none" stroke="#72243E" stroke-width="1.3"/>
  <path d="M46 541l9 7 9-7" fill="none" stroke="#72243E" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="75" y="544" class="title" fill="#4B1528">Send an email (V2)</text>
  <text x="75" y="561" class="sub" fill="#993556">Report + summary table attached</text>
</g>

<!-- ============ RIGHT COLUMN: Backing services ============ -->

<!-- Automation Account container (spans Create job + Get job output) -->
<rect x="380" y="150" width="270" height="176" rx="12" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.75" stroke-dasharray="4 3"/>
<text x="396" y="172" class="title" fill="#04342C">Automation runbook</text>
<text x="396" y="188" class="sub" fill="#0F6E56">PowerShell 7.2, managed identity</text>

<!-- Inner: Resource Graph -->
<rect x="396" y="200" width="238" height="60" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.75"/>
<text x="410" y="222" font-size="12.5" font-weight="600" fill="#042C53">Azure Resource Graph</text>
<text x="410" y="238" class="sub" fill="#185FA5">4 tables &#8226; all subscriptions</text>

<!-- Inner: VM / Compute lookup -->
<rect x="396" y="268" width="238" height="46" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.75"/>
<text x="410" y="288" font-size="12.5" font-weight="600" fill="#412402">Compute resources</text>
<text x="410" y="303" class="sub" fill="#854F0B">VM size &#8226; OS image detail</text>

<!-- Connectors: Create job -> Automation box, Automation box -> Get job output -->
<line x1="330" y1="188" x2="378" y2="188" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="378" y1="278" x2="330" y2="278" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Automation box -> Blob storage (vertical, runbook uploads report) -->
<line x1="515" y1="326" x2="515" y2="360" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Blob storage -->
<rect x="380" y="360" width="270" height="70" rx="10" fill="#FAECE7" stroke="#F0997B" stroke-width="0.75"/>
<ellipse cx="405" cy="384" rx="10" ry="4.5" fill="none" stroke="#712B13" stroke-width="1.3"/>
<path d="M395 384v14a10 4.5 0 0 0 20 0v-14" fill="none" stroke="#712B13" stroke-width="1.3"/>
<text x="425" y="390" class="title" fill="#4A1B0C">Blob storage</text>
<text x="425" y="407" class="sub" fill="#993C1D">monthly-reports container &#8226; .xlsx</text>

<!-- Blob storage -> Get blob content node (right to left, read direction) -->
<line x1="378" y1="458" x2="330" y2="458" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Office 365 Outlook -->
<rect x="380" y="522" width="270" height="56" rx="10" fill="#FBEAF0" stroke="#ED93B1" stroke-width="0.75"/>
<rect x="405" y="540" width="20" height="14" rx="1.5" fill="none" stroke="#72243E" stroke-width="1.3"/>
<path d="M405 541l10 8 10-8" fill="none" stroke="#72243E" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="435" y="545" class="title" fill="#4B1528">Office 365 Outlook</text>
<text x="435" y="562" class="sub" fill="#993556">Delivers the monthly report</text>

<!-- Send email -> Outlook (left to right) -->
<line x1="330" y1="548" x2="378" y2="548" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Legend -->
<rect x="30" y="600" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.75"/>
<text x="46" y="609" class="sub" fill="#5F5E5A">Automation</text>
<rect x="140" y="600" width="10" height="10" rx="2" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.75"/>
<text x="156" y="609" class="sub" fill="#5F5E5A">Data transform</text>
<rect x="270" y="600" width="10" height="10" rx="2" fill="#FAECE7" stroke="#F0997B" stroke-width="0.75"/>
<text x="286" y="609" class="sub" fill="#5F5E5A">Storage</text>
<rect x="360" y="600" width="10" height="10" rx="2" fill="#FBEAF0" stroke="#ED93B1" stroke-width="0.75"/>
<text x="376" y="609" class="sub" fill="#5F5E5A">Delivery</text>
<rect x="450" y="600" width="10" height="10" rx="2" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.75"/>
<text x="466" y="609" class="sub" fill="#5F5E5A">Query</text>
<rect x="530" y="600" width="10" height="10" rx="2" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.75"/>
<text x="546" y="609" class="sub" fill="#5F5E5A">VM detail</text>

</svg>
